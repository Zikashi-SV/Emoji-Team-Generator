<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emoji Team Generator | Administrator Login</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

    <!-- Header Navigation -->
    <header class="navbar">
        <div class="navbar-container">
            <a href="/" class="brand-logo">
                <span class="brand-icon">🔐</span>
                <span>Admin Portal</span>
            </a>
            <div class="nav-actions">
                <a href="/" class="btn btn-secondary btn-sm">Participant View</a>
            </div>
        </div>
    </header>

    <main class="main-content" style="max-width: 460px;">
        <div class="hero-card" style="padding: 2.5rem 2rem;">
            <h1>Administrator Access</h1>
            <p class="subtitle" style="margin-bottom: 2rem;">
                Sign in to manage event participants, configure team settings, and publish results.
            </p>

            <form id="admin-login-form">
                <div class="form-group">
                    <label for="admin-username" class="form-label">Username</label>
                    <input 
                        type="text" 
                        id="admin-username" 
                        class="form-input" 
                        placeholder="Enter admin username" 
                        required 
                        autocomplete="username"
                        autofocus
                    >
                </div>

                <div class="form-group">
                    <label for="admin-password" class="form-label">Password</label>
                    <input 
                        type="password" 
                        id="admin-password" 
                        class="form-input" 
                        placeholder="••••••••••••" 
                        required 
                        autocomplete="current-password"
                    >
                </div>

                <div id="login-error" style="display: none; margin-bottom: 1.25rem; color: #dc2626; font-size: 0.95rem; font-weight: 600; text-align: left; background: #fee2e2; padding: 0.75rem 1rem; border-radius: var(--radius-sm);">
                </div>

                <button type="submit" id="btn-login" class="btn btn-primary" style="width: 100%;">
                    <span id="btn-login-text">Sign In to Dashboard</span>
                </button>
            </form>

            <div style="margin-top: 2rem; font-size: 0.85rem; color: var(--text-muted); border-top: 1px solid var(--border-color); padding-top: 1.25rem;">
                🛡️ Initial credentials can be configured securely via <code>python create_admin.py</code>.
            </div>
        </div>
    </main>

    <footer style="text-align: center; padding: 1.5rem; color: var(--text-muted); font-size: 0.85rem;">
        Emoji Team Generator &copy; 2026 • Secure Administrator Console.
    </footer>

    <!-- Scripts -->
    <script src="/static/js/api.js"></script>
    <script src="/static/js/admin-login.js"></script>
</body>
</html>
