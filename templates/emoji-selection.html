<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emoji Team Generator | Select Your Emoji</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

    <!-- Header Navigation -->
    <header class="navbar">
        <div class="navbar-container">
            <a href="/" class="brand-logo">
                <span class="brand-icon">🎲</span>
                <span>Emoji Team Generator</span>
            </a>
            <div class="nav-actions">
                <span id="name-pill" class="badge badge-info" style="font-size: 0.95rem; text-transform: none;">
                    👤 <span id="display-name">Participant</span>
                </span>
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="hero-card" style="padding-bottom: 2rem;">
            <h1>Pick Your Team Avatar ✨</h1>
            <p class="subtitle">
                Choose an emoji that represents your spirit! This will be your avatar on the team roster.
            </p>

            <!-- Category Filter Chips -->
            <div class="category-filter" id="category-filter">
                <button type="button" class="filter-chip active" data-category="All">All Emojis</button>
                <button type="button" class="filter-chip" data-category="Animals">Animals 🦁</button>
                <button type="button" class="filter-chip" data-category="Food">Food 🍕</button>
                <button type="button" class="filter-chip" data-category="Cosmic">Power & Space 🚀</button>
                <button type="button" class="filter-chip" data-category="Fantasy">Magic & Characters 🤖</button>
            </div>

            <!-- Emoji Selection Grid -->
            <div class="emoji-grid" id="emoji-grid" role="radiogroup" aria-label="Emoji Selection">
                <div style="grid-column: 1 / -1; padding: 2rem; color: var(--text-muted);">
                    Loading emojis...
                </div>
            </div>

            <!-- Selected Emoji Preview Bar -->
            <div id="selection-preview-bar" style="margin: 1.5rem auto; padding: 1rem; background: var(--bg-main); border-radius: var(--radius-sm); max-width: 440px; display: flex; align-items: center; justify-content: space-between; border: 1.5px solid var(--border-color);">
                <div style="display: flex; align-items: center; gap: 0.75rem;">
                    <span id="preview-emoji-char" style="font-size: 2rem;">❓</span>
                    <div style="text-align: left;">
                        <div id="preview-emoji-name" style="font-weight: 700; color: var(--text-primary);">No emoji selected</div>
                        <div style="font-size: 0.8rem; color: var(--text-muted);" id="preview-status-text">Click any available emoji above</div>
                    </div>
                </div>
                <span id="selected-badge" class="badge badge-warning" style="display: none;">Ready</span>
            </div>

            <!-- Action Buttons: Back and Submit -->
            <div style="display: flex; gap: 1rem; max-width: 440px; margin: 0 auto;">
                <button type="button" id="btn-back" class="btn btn-secondary" style="flex: 1;">
                    <span>⬅️</span>
                    <span>Back</span>
                </button>
                <button type="button" id="btn-submit" class="btn btn-primary" style="flex: 2;" disabled>
                    <span id="btn-submit-text">Join & Enter Waiting Room</span>
                    <span>🚀</span>
                </button>
            </div>

            <div id="submission-error" style="display: none; margin-top: 1rem; color: #dc2626; font-weight: 600;"></div>
        </div>
    </main>

    <footer style="text-align: center; padding: 1.5rem; color: var(--text-muted); font-size: 0.85rem;">
        Emoji Team Generator &copy; 2026 • Fast, fair, and fun team allocations.
    </footer>

    <!-- Scripts -->
    <script src="/static/js/api.js"></script>
    <script src="/static/js/emoji-selection.js"></script>
</body>
</html>
